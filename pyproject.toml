[project]
name = "terrarium-cookbooks"
version = "0.1.0"
description = "Small, runnable worlds for the Terrarium SDK."
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "openai>=2.47.0",
    "terrarium-sdk>=0.4.0",
]

[dependency-groups]
dev = ["ruff==0.16.4"]

[tool.uv]
package = false

[tool.uv.sources]
# Remove this source when terrarium-sdk is published to a package registry.
terrarium-sdk = { git = "https://github.com/demosyne/terrarium.git", rev = "0e5b5f694a5c13c56279dd8db02ed5b60c63793a" }

[tool.ruff]
line-length = 120
